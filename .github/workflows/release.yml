name: Build & Release

# Тег vX.Y.Z → сборка ND_Launcher.exe и публикация релиза.
# Ручной запуск (Actions → Build & Release → Run workflow) — только тестовая сборка без релиза.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: ver
        run: |
          $v = (Select-String -Path nd_launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Тег ${{ github.ref_name }} не совпадает с VERSION = $v в nd_launcher.py"
            exit 1
          }
          Write-Host "Version: $v"

      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt

      - name: Fetch link icons
        continue-on-error: true   # без сети на сайты иконок лаунчер покажет запасной значок
        run: python nd_launcher.py --fetch-icons

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ND_Launcher --icon nd_icon.ico
          --add-data "brand;brand" --hidden-import nd_i18n
          nd_launcher.py

      - name: Package
        id: pkg
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "ND_Launcher_v$v.zip"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/ND_Launcher.exe, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
          "zip=$name" >> $env:GITHUB_OUTPUT
          Write-Host "$name  sha256=$hash"

      - name: Release notes from CHANGELOG
        run: |
          @'
          import re
          v = "${{ steps.ver.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else f"ND Launcher v{v}")
          body += ("\n\n---\n**Install:** unpack the zip and put `ND_Launcher.exe` into the root of your portable ComfyUI build "
                   "(next to `python_embeded` and `ComfyUI`).\n\n"
                   "The exe is not code-signed: if Windows SmartScreen appears, click *More info → Run anyway*. "
                   "SHA-256 checksum is attached.")
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(body)
          '@ | python -

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ND_Launcher_v${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ND Launcher ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
